            font-weight: 600;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }
        .social-btn:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
        }
        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        @media (min-width: 550px) {
            .links-container {
